<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7ECE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#162024" media="(prefers-color-scheme: dark)">
<title>Yol Planı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Harita paftası + yol levhası: serin kâğıt zemin, kontur kahvesi arazi, otoyol yeşili batarya,
   kehribar şarj. Barlow ailesi karayolu levha yazısından türemiştir. */
:root {
  --kagit: #E7ECE8; --yuzey: #F4F7F5; --murekkep: #1C282C; --soluk: #5E6E70; --cizgi: #C9D2CE;
  --arazi: #B79B7A; --batarya: #1D6B47; --sarj: #C98A0E; --uyari: #B3372A; --devlet: #2356A6;
  --yazi: 'Barlow', system-ui, sans-serif; --sayi: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --kagit: #162024; --yuzey: #1D292E; --murekkep: #E3EAE7; --soluk: #93A4A6; --cizgi: #2E3D42;
    --arazi: #7D6A55; --batarya: #4FB07F; --sarj: #E8AE3A; --uyari: #E0685A; --devlet: #7FA6E8;
  }
}
:root[data-theme="dark"] {
  --kagit: #162024; --yuzey: #1D292E; --murekkep: #E3EAE7; --soluk: #93A4A6; --cizgi: #2E3D42;
  --arazi: #7D6A55; --batarya: #4FB07F; --sarj: #E8AE3A; --uyari: #E0685A; --devlet: #7FA6E8;
}
* { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--kagit); color: var(--murekkep);
  font: 400 16px/1.45 var(--yazi); -webkit-text-size-adjust: 100%;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 32px);
}
main { max-width: 640px; margin: 0 auto; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
h1 { font: 700 30px/1 var(--sayi); letter-spacing: -0.01em; margin: 0; }
h2 { font: 600 19px/1.2 var(--sayi); margin: 28px 0 10px; }
.arac { font: 500 15px var(--sayi); color: var(--soluk); background: none; border: 0; padding: 6px 0; text-decoration: underline dotted; }
.guzergah { position: relative; padding-left: 22px; }
.guzergah::before { content: ''; position: absolute; left: 6px; top: 22px; bottom: 22px; border-left: 2px dashed var(--cizgi); }
.nokta { position: relative; margin-bottom: 8px; }
.nokta::before { content: ''; position: absolute; left: -21px; top: 17px; width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid var(--murekkep); background: var(--kagit); }
.nokta.son::before { background: var(--murekkep); }
input[type=text], input[type=datetime-local], select {
  width: 100%; font: 500 17px var(--yazi); color: var(--murekkep); background: var(--yuzey);
  border: 1px solid var(--cizgi); border-radius: 10px; padding: 11px 12px; min-height: 46px;
}
input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--devlet); outline-offset: 2px; }
.oneri { list-style: none; margin: 4px 0 0; padding: 0; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 10px; overflow: hidden; }
.oneri button { display: block; width: 100%; text-align: left; font: 400 15px var(--yazi); color: var(--murekkep);
  background: none; border: 0; border-bottom: 1px solid var(--cizgi); padding: 10px 12px; }
.oneri li:last-child button { border-bottom: 0; }
.ayar { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin: 16px 0; }
.ayar label { display: block; font-size: 14px; color: var(--soluk); }
.ayar output { font: 600 20px var(--sayi); color: var(--murekkep); float: right; }
.ayar .genis { grid-column: 1 / -1; }
.ayar .onay { display: flex; align-items: center; gap: 8px; color: var(--murekkep); font-size: 15px; align-self: end; min-height: 46px; }
.onay input { width: 22px; height: 22px; accent-color: var(--batarya); }
.ust { display: flex; gap: 16px; }
.durak .isi { font-size: 14px; margin-top: 4px; }
.durak .isi.soguk { color: var(--devlet); }
dl.degerler { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0; font-size: 14px; }
dl.degerler dt { color: var(--soluk); } dl.degerler dd { margin: 0; font: 600 15px var(--sayi); text-align: right; }
.dugmeler { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.ikincil { font: 600 16px var(--sayi); color: var(--murekkep); background: none; border: 1px solid var(--cizgi); border-radius: 10px; padding: 11px; min-height: 46px; }
.ikincil:disabled { opacity: .45; }
pre.ham { font-size: 11px; max-height: 160px; overflow: auto; background: var(--kagit); border-radius: 8px; padding: 8px; white-space: pre-wrap; }
.kucuk { font-size: 13px; color: var(--soluk); }
input[type=range] { width: 100%; accent-color: var(--batarya); margin: 6px 0 0; }
.planla { width: 100%; font: 600 19px var(--sayi); color: var(--kagit); background: var(--murekkep);
  border: 0; border-radius: 12px; padding: 14px; min-height: 52px; }
.planla:disabled { opacity: .55; }
.durum { min-height: 22px; margin: 10px 0 0; color: var(--soluk); font-size: 15px; }
.durum.hata { color: var(--uyari); }
.secim { display: flex; gap: 8px; margin: 22px 0 12px; overflow-x: auto; }
.secim button { flex: 1 0 auto; text-align: left; font: 500 14px/1.25 var(--yazi); color: var(--soluk);
  background: transparent; border: 1px solid var(--cizgi); border-radius: 10px; padding: 9px 12px; }
.secim button[aria-pressed=true] { color: var(--murekkep); border-color: var(--murekkep); box-shadow: inset 0 0 0 1px var(--murekkep); }
.secim b { display: block; font: 600 18px var(--sayi); color: var(--murekkep); }
.profil { margin: 0 -18px; background: var(--yuzey); border-block: 1px solid var(--cizgi); padding: 14px 0 8px; }
.profil svg { display: block; width: 100%; height: auto; }
.profil figcaption { font-size: 13px; color: var(--soluk); padding: 4px 18px 0; }
.ozet { font: 500 21px/1.35 var(--sayi); margin: 18px 0 0; }
.ozet strong { font-weight: 700; }
.duraklar { list-style: none; margin: 0; padding: 0; counter-reset: d; }
.durak { position: relative; padding: 14px 0 14px 44px; border-bottom: 1px solid var(--cizgi); }
.durak::before { counter-increment: d; content: counter(d); position: absolute; left: 0; top: 14px;
  width: 30px; height: 30px; border-radius: 50%; background: var(--sarj); color: #1C1405;
  font: 700 17px/30px var(--sayi); text-align: center; }
.durak .km { font: 600 15px var(--sayi); color: var(--soluk); }
.durak .ad { font-weight: 600; font-size: 17px; margin: 1px 0 4px; }
.durak .sarj { font: 600 20px var(--sayi); }
.durak .sarj span { color: var(--soluk); font-weight: 500; font-size: 16px; }
.durak .not { font-size: 14px; color: var(--soluk); margin-top: 4px; }
.durak .not.dikkat { color: var(--uyari); }
.yedek { margin-top: 8px; font-size: 14px; }
.yedek summary { cursor: pointer; color: var(--devlet); }
.harita { color: var(--devlet); font-weight: 600; white-space: nowrap; }
.yedek ul { margin: 6px 0 0; padding-left: 18px; }
.uyari { border-left: 3px solid var(--uyari); padding: 6px 0 6px 12px; margin: 16px 0; }
.bilgi { border-left: 3px solid var(--cizgi); padding: 6px 0 6px 12px; margin: 16px 0; color: var(--soluk); }
details.bolumler summary { font: 600 18px var(--sayi); cursor: pointer; margin-top: 26px; }
.tablo { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font: 500 14px var(--sayi); font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--cizgi); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--soluk); font-weight: 500; }
.kaynak { font-size: 13px; color: var(--soluk); margin-top: 28px; }
dialog { border: 0; border-radius: 14px; background: var(--yuzey); color: var(--murekkep); width: min(92vw, 420px); padding: 18px; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog label { display: block; font-size: 14px; color: var(--soluk); margin-top: 14px; }
dialog output { float: right; font: 600 18px var(--sayi); color: var(--murekkep); }
@media (prefers-reduced-motion: no-preference) {
  .profil .cizgi { stroke-dasharray: var(--uz); stroke-dashoffset: var(--uz); animation: ciz 1.1s ease-out forwards; }
  @keyframes ciz { to { stroke-dashoffset: 0; } }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Yol Planı</h1>
    <div class="ust">
      <button class="arac" id="obdDugme" type="button">OBD</button>
      <button class="arac" id="aracDugme" type="button"></button>
    </div>
  </header>

  <section class="guzergah" aria-label="Güzergâh">
    <div class="nokta"><input id="nereden" type="text" autocomplete="off" aria-label="Nereden" placeholder="Nereden">
      <ul class="oneri" id="neredenOneri" hidden></ul></div>
    <div class="nokta son"><input id="nereye" type="text" autocomplete="off" aria-label="Nereye" placeholder="Nereye">
      <ul class="oneri" id="nereyeOneri" hidden></ul></div>
  </section>

  <section class="ayar" aria-label="Yolculuk ayarları">
    <label>Çıkışta batarya <output id="socOut"></output>
      <input id="soc" type="range" min="20" max="100" step="1" value="90"></label>
    <label>Varışta en az <output id="varisOut"></output>
      <input id="varis" type="range" min="5" max="50" step="1" value="15"></label>
    <label class="genis">Hız, sınırın <output id="hizOut"></output>
      <input id="hiz" type="range" min="80" max="110" step="5" value="100"></label>
    <label class="genis">Çıkış zamanı
      <input id="cikis" type="datetime-local"></label>
    <label>Araç geceyi geçirdi
      <select id="garaj">
        <option value="">Dışarıda</option>
        <option value="12">Kapalı otoparkta</option>
        <option value="18">Isıtmalı garajda</option>
      </select></label>
    <label class="onay"><input id="onIsitma" type="checkbox" checked> Ön ısıtma kullanacağım</label>
  </section>

  <button class="planla" id="planla" type="button">Planla</button>
  <p class="durum" id="durum" role="status" aria-live="polite"></p>

  <div id="sonuc" hidden>
    <div class="secim" id="secim" role="group" aria-label="Rota seçenekleri"></div>
    <figure class="profil" id="profil"></figure>
    <p class="ozet" id="ozet"></p>
    <div id="uyarilar"></div>
    <h2 id="durakBaslik">Şarj durakları</h2>
    <ol class="duraklar" id="duraklar"></ol>
    <details class="bolumler"><summary>Bölüm bölüm</summary><div class="tablo" id="bolumler"></div></details>
    <p class="kaynak" id="kaynak"></p>
  </div>
</main>

<dialog id="aracDialog">
  <form method="dialog">
    <h2 style="margin-top:0">Araç</h2>
    <label>Model <select id="aracSec"></select></label>
    <label>Batarya sağlığı <output id="sohOut"></output>
      <input id="soh" type="range" min="80" max="100" step="1" value="100"></label>
    <button class="planla" style="margin-top:18px" value="tamam">Kaydet</button>
  </form>
</dialog>

<dialog id="obdDialog">
  <h2 style="margin-top:0">OBD</h2>
  <p class="kucuk">vLinker MC+ araçta takılıyken ve kontak açıkken bağlan. Kayıtlar yalnızca bu telefonda tutulur.</p>
  <p class="durum" id="obdDurum" role="status" aria-live="polite"></p>
  <div class="dugmeler">
    <button class="ikincil" id="obdBaglan" type="button">Bağlan</button>
    <button class="ikincil" id="obdOku" type="button" disabled>Oku</button>
    <button class="ikincil" id="obdKayit" type="button" disabled>Kaydı başlat</button>
    <button class="ikincil" id="obdKopya" type="button">Ham çıktıyı kopyala</button>
  </div>
  <p class="kucuk" id="obdKayitBilgi"></p>
  <dl class="degerler" id="obdDegerler"></dl>
  <details><summary class="kucuk">Ham çıktı</summary><pre class="ham" id="obdHam"></pre></details>
  <h2>Kalibrasyon</h2>
  <p class="kucuk" id="obdKalib"></p>
  <div class="dugmeler">
    <button class="ikincil" id="obdGuncelle" type="button">Kayıtlardan güncelle</button>
    <button class="ikincil" id="obdSil" type="button">Kayıtları sil</button>
  </div>
  <form method="dialog"><button class="planla" style="margin-top:14px">Kapat</button></form>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
