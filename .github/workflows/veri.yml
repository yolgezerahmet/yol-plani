name: Veri güncelle

# EPDK şarj istasyonu listesini (resmî koordinatlarıyla) haftada bir yeniler.
# Parametresiz sorgu saatte bir yapılabilir; haftalık çalışma bu sınırın çok altında.
on:
  schedule:
    - cron: '30 3 * * 1'   # Pazartesi 06:30 TSİ
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  epdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: EPDK istasyonlarını indir
        run: node scripts/epdk-guncelle.mjs www/data/epdk.json
      - name: Değiştiyse kaydet ve APK'yı yeniden derle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- www/data/epdk.json && git ls-files --error-unmatch www/data/epdk.json >/dev/null 2>&1; then
            echo "Değişiklik yok"; exit 0
          fi
          git config user.name "yol-plani-veri"
          git config user.email "actions@users.noreply.github.com"
          git add www/data/epdk.json
          git commit -m "EPDK istasyon listesi: $(date -u +%F)"
          git push
          # GITHUB_TOKEN ile yapılan push başka iş akışını tetiklemez; derlemeyi elle başlat.
          gh workflow run build.yml --ref main
